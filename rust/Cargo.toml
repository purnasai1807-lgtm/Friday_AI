[workspace]
resolver = "2"
members = [
    "crates/friday-core",
    "crates/friday-engine",
    "crates/friday-agents",
    "crates/friday-tools",
    "crates/friday-learning",
    "crates/friday-telemetry",
    "crates/friday-traces",
    "crates/friday-security",
    "crates/friday-mcp",
    "crates/friday-python",
    "crates/friday-sessions",
    "crates/friday-workflow",
    "crates/friday-skills",
    "crates/friday-recipes",
    "crates/friday-templates",
    "crates/friday-a2a",
    "crates/friday-scheduler",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
regex = "1"
once_cell = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
parking_lot = "0.12"
async-trait = "0.1"
pyo3 = { version = "0.23", features = ["extension-module"] }
meval = "0.2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fnmatch-regex = "0.2"
url = "2"
sysinfo = "0.33"
rig-core = "0.31"
schemars = "1"
